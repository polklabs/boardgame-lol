<app-control-wrapper
  #ControlWrapper
  [label]="label"
  [controlName]="formControlName"
  [formGroup]="formGroup"
  [entityType]="entityType"
  textInputType="array">
  <p-multiselect
    #dropdown
    inputId="{{ formControlName }}"
    formControlName="{{ formControlName }}"
    [options]="(options$ ? (options$ | async) ?? [] : options ?? []) | sort: optionLabel"
    optionLabel="Text"
    display="chip"
    (onPanelShow)="onPanelShow(dropdown)">
    <ng-template let-items #selecteditems>
      @for (tag of items; track tag) {
        <app-tag [tag]="tag"></app-tag>
      }
    </ng-template>
    <ng-template #dropdownicon>
      <i class="pi pi-tags"></i>
    </ng-template>
  </p-multiselect>
</app-control-wrapper>

@if (editorTagsVisible) {
  <app-tag-picker
    [editorVisible]="editorTagsVisible"
    mode="selector"
    [selectedTags]="dropdown.modelValue()"
    [filterBool]="filterBool"
    [filterBoardGame]="filterBoardGame"
    (closeEditor)="closePicker(dropdown, $event)"></app-tag-picker>
}
