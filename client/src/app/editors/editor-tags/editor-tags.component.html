<app-dialog [title]="title" [visible]="editorVisible" (visibleChange)="closeEditor.emit()" [editor]="true">
  @if (formGroup && tag) {
    <div class="tag-display items-center">
      <p-tag
        severity="contrast"
        [value]="formGroup.value.Text"
        [style]="{ color: formGroup.value.Color, background: bgColor }" />
    </div>

    <div class="form">
      <form [formGroup]="formGroup" (ngSubmit)="submit(false)">
        <app-textinput
          formControlName="Text"
          [entityType]="entityType"
          [autoFocus]="true"
          [appHide]="hideFields"></app-textinput>

        <app-dropdown
          formControlName="Category"
          [entityType]="entityType"
          [appHide]="hideFields"
          [options]="categoryTypes"
          optionLabel="label"
          optionValue="value"
          [showClear]="true"></app-dropdown>

        <div class="flex align-center gap-4">
          <p-colorpicker
            [ngStyle]="{ 'border-color': bgColor }"
            [(ngModel)]="formGroup.value.Color"
            (onChange)="setColor($event.value)"
            [ngModelOptions]="{ standalone: true }"
            defaultColor="000000" />
          <app-textinput formControlName="Color" [entityType]="entityType" [appHide]="hideFields"></app-textinput>

          @for (preset of presetColors; track preset) {
            <p-button variant="outlined" [severity]="preset.severity" (onClick)="setColor(preset.color)">
              {{ [preset.text] }}
            </p-button>
          }
        </div>

        <app-dropdown
          formControlName="DisplayOnBoardGameId"
          label="Display Only On BoardGame"
          [entityType]="entityType"
          [appHide]="hideFields"
          [options$]="boardGames$"
          optionLabel="Name"
          optionValue="BoardGameId"
          [showClear]="true"></app-dropdown>

        <div class="checkbox-column">
          <h3>Display On Editors:</h3>
          <app-checkbox formControlName="DisplayOnBoardGames" label="BoardGames" [appHide]="hideFields"></app-checkbox>
          <app-checkbox formControlName="DisplayOnPlayers" label="Players" [appHide]="hideFields"></app-checkbox>
          <app-checkbox formControlName="DisplayOnGames" label="Plays" [appHide]="hideFields"></app-checkbox>
          <app-checkbox
            formControlName="DisplayOnPlayerGames"
            label="Play Scores"
            [appHide]="hideFields"></app-checkbox>
        </div>
      </form>
    </div>
  }
  <ng-container class="dialog-footer">
    @if (formGroup && tag) {
      <div>
        <p-button label="Delete" [outlined]="true" severity="danger" (onClick)="toDeleteEntity()"></p-button>
      </div>
      <div>
        <p-button label="Cancel" [outlined]="true" severity="secondary" (onClick)="closeEditor.emit()"></p-button>
        @if (standalone) {
          <p-button label="Save" [outlined]="true" (onClick)="submit(false)"></p-button>
        }
        <p-button label="Save & Close" [outlined]="true" (onClick)="submit(true)"></p-button>
      </div>
    }
  </ng-container>
</app-dialog>
