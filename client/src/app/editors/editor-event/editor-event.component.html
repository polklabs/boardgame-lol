<p-dialog
  contentStyleClass="event-editor-dialog"
  [header]="title"
  [visible]="editorVisible"
  (visibleChange)="closeEditor.emit()"
  [modal]="true"
  [style]="{ width: '650px', 'min-width': '300px' }"
  [draggable]="false"
  appendTo="body"
  position="bottom">
  <div class="flex-column gap-8">
    @if (events.length > 0) {
      <app-table
        [columns]="columns"
        [rows]="events"
        [canEdit]="true"
        (edit)="editEvent($event)"
        [showExpansion]="false"></app-table>
    }
    <div class="flex justify-content-end">
      <p-button label="Add New" [outlined]="true" severity="secondary" (onClick)="newEvent()"></p-button>
    </div>
  </div>

  @if (formGroup && event) {
    <div class="form">
      <form [formGroup]="formGroup" (ngSubmit)="submit()">
        <app-textinput
          formControlName="Name"
          label="Event Name"
          [entityType]="entityType"
          [hiddenFields]="hideFields"></app-textinput>

        <div class="flex-grow gap-8 width-100">
          <app-calendar
            formControlName="StartDate"
            label="Start Date"
            [entityType]="entityType"
            [hiddenFields]="hideFields"></app-calendar>
          <app-calendar
            formControlName="EndDate"
            label="End Date"
            [entityType]="entityType"
            [hiddenFields]="hideFields"></app-calendar>
        </div>

        <div class="dialog-footer">
          <div>
            <p-button label="Delete" [outlined]="true" severity="danger" (onClick)="toDeleteEntity()"></p-button>
          </div>
          <div>
            <p-button label="Cancel" [outlined]="true" severity="secondary" (onClick)="cancelEdit()"></p-button>
            <p-button label="Save" [outlined]="true" (onClick)="submit()"></p-button>
          </div>
        </div>
      </form>
    </div>
  }
</p-dialog>
