<app-editor-player
  [editorVisible]="playerEditorVisible"
  [player]="playerEdit"
  [standalone]="false"
  (closeEditor)="closePlayerEditor($event)"></app-editor-player>

<app-dialog [title]="title" [visible]="editorVisible" (visibleChange)="closeEditor.emit()" [editor]="true">
  @if (formGroup && playerGame) {
    <div class="form">
      <form [formGroup]="formGroup" (ngSubmit)="submit()">
        <div class="flex gap-4 justify-content-space-between">
          <app-checkbox formControlName="Team" [hiddenFields]="hideFields"></app-checkbox>
          <app-textinput
            style="flex-grow: 1"
            formControlName="Name"
            label="Team Name"
            [entityType]="entityType"
            [appHide]="hideFields"></app-textinput>
        </div>

        @if (getValue('Team')) {
          <app-multi-select
            formControlName="Players"
            label="Players"
            [entityType]="entityType"
            [appHide]="hideFields"
            [options$]="playerList$"
            [maxSelectedLabels]="-1"
            optionLabel="FullName"
            [addNewButton]="true"
            [showFilter]="true"
            (addNew)="addPlayer()"></app-multi-select>
        } @else {
          <app-dropdown
            formControlName="Players"
            label="Player"
            [entityType]="entityType"
            [appHide]="hideFields"
            [options$]="playerList$"
            optionLabel="FullName"
            [addNewButton]="true"
            [showFilter]="true"
            (addNew)="addPlayer()"></app-dropdown>
        }

        <div class="flex gap-4 justify-content-space-between">
          <app-checkbox formControlName="ScoringPlayer" label="Has Score" [appHide]="hideFields"></app-checkbox>
          @if (scoreType === 'points') {
            <app-number-input
              style="flex-grow: 1"
              formControlName="Points"
              label="Points"
              [entityType]="entityType"
              [appHide]="hideFields"
              [boardGame]="playerGame.Game?.BoardGame"></app-number-input>
          } @else if (scoreType === 'win-lose') {
            <app-checkbox formControlName="Points" label="Won Game" [hiddenFields]="hideFields"></app-checkbox>
          }
        </div>

        <app-tags
          formControlName="Tags"
          label="Tags"
          filterBool="DisplayOnPlayerGames"
          [filterBoardGame]="boardGameId"
          [entityType]="entityType"
          [appHide]="hideFields"
          [options$]="tagList$"></app-tags>
      </form>
    </div>
  }

  <ng-container class="dialog-footer">
    @if (formGroup && playerGame) {
      <div>
        <p-button label="Delete" [outlined]="true" severity="danger" (onClick)="toDeleteEntity()"></p-button>
      </div>
      <div>
        <p-button label="Cancel" [outlined]="true" severity="secondary" (onClick)="closeEditor.emit()"></p-button>
        <p-button label="Apply" [outlined]="true" (onClick)="submit()"></p-button>
      </div>
    }
  </ng-container>
</app-dialog>
