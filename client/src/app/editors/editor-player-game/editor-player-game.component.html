<app-editor-player
  [editorVisible]="playerEditorVisible"
  [player]="playerEdit"
  [standalone]="true"
  (closeEditor)="playerEditorVisible = false"></app-editor-player>

<p-dialog
  [header]="title"
  [visible]="editorVisible"
  (visibleChange)="closeEditor.emit()"
  [modal]="true"
  [style]="{ width: '650px', 'min-width': '300px' }"
  [draggable]="false"
  position="bottom">
  @if (formGroup && playerGame) {
    <div class="form">
      <form [formGroup]="formGroup" (ngSubmit)="submit()">
        <div class="flex gap-4 justify-content-space-between">
          <app-checkbox formControlName="Team" [hiddenFields]="hideFields"></app-checkbox>
          <app-textinput
            style="flex-grow: 1"
            formControlName="Name"
            label="Team Name"
            [entityType]="entityType"
            [hiddenFields]="hideFields"></app-textinput>
        </div>

        @if (getValue('Team')) {
          <app-multi-select
            formControlName="Players"
            label="Players"
            [entityType]="entityType"
            [hiddenFields]="hideFields"
            [options$]="playerList$"
            [maxSelectedLabels]="-1"
            optionLabel="Name"
            [addNewButton]="true"
            (addNew)="addPlayer()"></app-multi-select>
        } @else {
          <app-dropdown
            formControlName="Players"
            label="Player"
            [entityType]="entityType"
            [hiddenFields]="hideFields"
            [options$]="playerList$"
            optionLabel="Name"
            [addNewButton]="true"
            (addNew)="addPlayer()"></app-dropdown>
        }

        <div class="flex gap-4 justify-content-space-between">
          <app-checkbox
            formControlName="ScoringPlayer"
            label="Has Score"
            [hiddenFields]="hideFields"></app-checkbox>
          @if (scoreType === 'points') {
            <app-number-input
              style="flex-grow: 1"
              formControlName="Points"
              label="Points"
              [entityType]="entityType"
              [hiddenFields]="hideFields"
              [boardGame]="playerGame.Game?.BoardGame"></app-number-input>
          } @else if (scoreType === 'win-lose') {
            <app-checkbox
              formControlName="Points"
              label="Won Game"
              [hiddenFields]="hideFields"></app-checkbox>
          }
        </div>

        <app-tags
          formControlName="Tags"
          label="Tags"
          filterBool="DisplayOnPlayerGames"
          [filterBoardGame]="boardGameId"
          [entityType]="entityType"
          [hiddenFields]="hideFields"
          [options$]="tagList$"></app-tags>

        <div class="dialog-footer">
          <div>
            <p-button label="Delete" [outlined]="true" severity="danger" (onClick)="toDeleteEntity()"></p-button>
          </div>
          <div>
            <p-button label="Cancel" [outlined]="true" severity="secondary" (onClick)="closeEditor.emit()"></p-button>
            <p-button label="Apply" [outlined]="true" (onClick)="submit()"></p-button>
          </div>
        </div>
      </form>
    </div>
  }
</p-dialog>
